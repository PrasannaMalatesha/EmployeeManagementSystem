# Base configuration. Environment-specific values live in application-<profile>.yml.
# Default profile is 'dev' so `./mvnw spring-boot:run` works out of the box against
# the Postgres + MinIO stack in compose.yml.

spring:
  application:
    name: ems
  profiles:
    default: dev
  jpa:
    # DR-004: never let Hibernate touch the schema. Flyway is the source of truth.
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true

server:
  port: 8080
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  info:
    env:
      enabled: true
